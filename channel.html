<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TPZ+</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="TPZ+">
<link rel="manifest" href="/site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0a0a;
  --glass:rgba(255,255,255,.02);
  --hair:rgba(255,255,255,.08);
  --hair-strong:rgba(255,255,255,.14);
  --text:#f5f5f5;
  --text2:#8a8a8a;
  --text3:#5a5a5a;
  --red:#ff0033;
  --red-hover:#e00029;
  --radius:10px;
  --radius-sm:6px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg)}
body{
  font-family:'Inter',-apple-system,system-ui,sans-serif;
  color:var(--text);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
a{color:inherit;text-decoration:none}

body::before{
  content:"";
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 50% 40% at 20% 0%, rgba(255,0,51,.06), transparent 60%),
    radial-gradient(ellipse 50% 40% at 100% 100%, rgba(120,140,255,.04), transparent 60%);
  pointer-events:none;
  z-index:0;
}
body > *{position:relative;z-index:1}

.nav{
  position:sticky;
  top:0;
  z-index:100;
  height:60px;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  background:rgba(10,10,10,.65);
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  border-bottom:1px solid var(--hair);
}
.brand{
  display:flex;
  align-items:baseline;
  gap:1px;
  font-size:17px;
  font-weight:700;
  letter-spacing:-.3px;
}
.brand .plus{color:var(--red)}
.back{
  font-size:13px;
  color:var(--text2);
  padding:8px 14px;
  border:1px solid var(--hair);
  border-radius:var(--radius-sm);
  font-weight:500;
  transition:color .2s, border-color .2s;
}
.back:hover{color:var(--text);border-color:var(--hair-strong)}

main{
  flex:1;
  max-width:1240px;
  width:100%;
  margin:0 auto;
  padding:28px 24px 50px;
}

.title{
  font-size:22px;
  font-weight:600;
  letter-spacing:-.3px;
  margin:0 0 12px;
}
.meta{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  font-size:13px;
  color:var(--text2);
  margin-bottom:20px;
}
.meta .live{
  color:var(--red);
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:500;
}
.meta .dot{
  width:6px;height:6px;border-radius:50%;background:currentColor;
  animation:blink 1.4s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

.player{
  background:#000;
  border:1px solid var(--hair);
  border-radius:var(--radius);
  overflow:hidden;
  aspect-ratio:16/9;
  width:100%;
  position:relative;
}
.player iframe{width:100%;height:100%;border:0;display:block}
.shield{position:absolute;left:0;right:0;z-index:5}
.shield.top{top:0;height:12%}
.shield.bot{bottom:0;height:4%}

.note{
  margin-top:20px;
  padding:14px 16px;
  background:var(--glass);
  border:1px solid var(--hair);
  border-radius:var(--radius);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  font-size:13px;
  color:var(--text2);
  line-height:1.6;
}

.error{
  text-align:center;
  padding:80px 20px;
}
.error h2{font-size:18px;font-weight:600;margin-bottom:8px}
.error a{
  display:inline-block;
  margin-top:12px;
  background:var(--red);
  color:#fff;
  padding:8px 16px;
  border-radius:var(--radius-sm);
  font-size:13px;
  font-weight:500;
}
.error a:hover{background:var(--red-hover)}

footer{
  border-top:1px solid var(--hair);
  padding:24px;
  font-size:12px;
  color:var(--text3);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}
.foot-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px}
.foot-nav a{color:var(--text3)}
.foot-nav a:hover{color:var(--text2)}
.foot-sources{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}
.foot-sources a{color:var(--text2);text-decoration:underline;text-underline-offset:2px}
.foot-sources a:hover{color:var(--text)}

html.intro .nav{opacity:0;transform:translateY(-9px)}
html.intro main > *{opacity:0;transform:translateY(12px)}
html.intro footer{opacity:0}
.nav, main > *, footer{
  transition:opacity .6s cubic-bezier(.16,1,.3,1),
             transform .6s cubic-bezier(.16,1,.3,1);
}

@media (max-width:700px){
  .nav{padding:0 14px;height:56px}
  .brand{font-size:15px}
  .back{padding:6px 10px;font-size:12px}
  main{padding:20px 14px 40px}
  .title{font-size:17px}
  .shield.top{height:28%}
  .shield.bot{height:12%}
}
</style>

<script>
  document.documentElement.classList.add('intro');
  setTimeout(() => document.documentElement.classList.remove('intro'), 800);
</script>
</head>
<body>

<nav class="nav">
  <a href="/" class="brand">TPZ<span class="plus">+</span></a>
  <a href="/" class="back">Retour</a>
</nav>

<main id="app">
  <div class="error"><h2>Chargement</h2></div>
</main>

<footer>
  <div class="foot-nav">
    <a href="/dmca.html">DMCA</a>
    <a href="/mentions.html">Mentions</a>
    <a href="/conditions.html">Conditions</a>
    <a href="/confidentialite.html">Confidentialité</a>
  </div>
  <div class="foot-sources">
    <span>Sources</span>
    <a href="https://www.fctv33.com/" target="_blank" rel="noopener">FCTV33</a>
    <a href="https://cdnlivetv.is/" target="_blank" rel="noopener">CDN Live TV</a>
  </div>
</footer>

<script>
const params = new URLSearchParams(location.search);
const name = params.get('name');
const url = params.get('url');
const app = document.getElementById('app');

if(!name || !url){
  app.innerHTML = `
    <div class="error">
      <h2>Chaîne introuvable</h2>
      <a href="/">Retour</a>
    </div>`;
} else {
  app.innerHTML = `
    <h1 class="title">${decodeURIComponent(name)}</h1>
    <div class="meta">
      <span class="live"><span class="dot"></span>En direct</span>
      <span>Chaîne</span>
    </div>
    <div class="player">
      <iframe src="${decodeURIComponent(url)}" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
      <div class="shield top"></div>
      <div class="shield bot"></div>
    </div>
    <div class="note">
      Si le flux ne se lance pas, recharge la page ou vérifie ta connexion. Ce contenu provient d'une source externe.
    </div>
  `;
}

document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
