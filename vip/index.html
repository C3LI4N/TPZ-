<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPZ+ - Lecture</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TPZ+">
    <link rel="manifest" href="/site.webmanifest">

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;0,900;1,700;1,900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #08080a;
            --bg-alt: #101014;
            --bg-elev: #16161c;
            --bg-glass: rgba(22, 22, 28, 0.65);
            --border: rgba(255,255,255,0.07);
            --border-strong: rgba(255,255,255,0.16);
            --text: #ffffff;
            --text-dim: #9a9aa4;
            --text-mute: #5a5a64;
            --red: #dc314e;
            --red-hover: #f46e84;
            --red-glow: rgba(220,49,78,0.35);
            --nav-height: 64px;
            --radius: 20px;
            --radius-sm: 14px;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex; flex-direction: column;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 55% 45% at 15% 0%, rgba(220,49,78,0.08), transparent 60%),
                radial-gradient(ellipse 50% 40% at 100% 100%, rgba(103,232,249,0.05), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        body > * { position: relative; z-index: 1; }

        /* ── NAVBAR ── */
        header {
            padding: 0 28px;
            height: var(--nav-height);
            background: rgba(8,8,10,0.75);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
            gap: 12px;
        }
        .brand {
            display: flex; align-items: center; gap: 6px;
            font-weight: 900;
            font-size: 1.35rem;
            font-style: italic;
            letter-spacing: -0.6px;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text);
        }
        .brand .plus { color: var(--red); }

        header a.back {
            background: linear-gradient(135deg, var(--red) 0%, #b02240 100%);
            color: white;
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 800;
            font-style: italic;
            padding: 10px 22px;
            border: none;
            border-radius: 50px;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            box-shadow: 0 6px 20px var(--red-glow);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        header a.back:hover {
            background: linear-gradient(135deg, var(--red-hover) 0%, var(--red) 100%);
            transform: translateY(-1px);
            box-shadow: 0 10px 26px rgba(220,49,78,0.55);
        }

        /* ── WRAPPER ── */
        .wrapper {
            flex: 1;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 32px 28px 50px;
        }

        /* ── MATCH HEADER ── */
        .match-header {
            margin-bottom: 24px;
            display: flex; flex-wrap: wrap;
            align-items: center; justify-content: space-between;
            gap: 14px;
        }
        .match-header h2 {
            font-size: 1.65rem;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: -0.8px;
            margin: 0;
        }
        .match-meta {
            display: flex; gap: 8px; flex-wrap: wrap;
            font-size: 0.72rem;
        }
        .match-meta span {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            padding: 7px 16px;
            border-radius: 50px;
            border: 1px solid var(--border);
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .live-tag {
            color: var(--red) !important;
            border-color: rgba(220,49,78,0.35) !important;
            background: rgba(220,49,78,0.1) !important;
            display: inline-flex; align-items: center; gap: 7px;
        }
        .live-tag .dot {
            width: 6px; height: 6px;
            background: var(--red);
            border-radius: 50%;
            animation: blink 1.2s infinite;
            box-shadow: 0 0 8px var(--red);
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

        /* ── PLAYER ── */
        .player-wrap { position: relative; width: 100%; }
        .player-box {
            background: #000;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            width: 100% !important;
            height: auto !important;
            min-height: 0 !important;
            aspect-ratio: 16 / 9 !important;
            max-height: 75vh !important;
            position: relative;
            transition: height 0.3s ease;
        }
        .player-box iframe, .player-box video {
            width: 100% !important; height: 100% !important;
            border: none; display: block;
        }

        .player-wrap.langues-open .player-box {
            aspect-ratio: auto !important;
            height: 80vh !important;
            max-height: 80vh !important;
        }

        /* ── CLICK SHIELDS ── */
        .click-shield {
            position: absolute;
            left: 0; right: 0;
            background: transparent;
            z-index: 5;
            pointer-events: auto;
        }
        .click-shield.top    { top: 0;    height: 12%; }
        .click-shield.bottom { bottom: 0; height: 4%;  }
        .player-wrap.langues-open .click-shield { display: none; }

        /* ── BOUTONS ── */
        .player-actions {
            margin-top: 20px;
            display: flex; gap: 10px; flex-wrap: wrap;
            justify-content: center;
        }
        .btn-action {
            background: linear-gradient(135deg, var(--red) 0%, #b02240 100%);
            color: white;
            border: none;
            padding: 13px 30px;
            border-radius: 50px;
            font-family: inherit;
            font-weight: 800;
            font-style: italic;
            font-size: 0.8rem;
            letter-spacing: 0.8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
            display: inline-flex; align-items: center; gap: 8px;
            box-shadow: 0 6px 20px var(--red-glow);
        }
        .btn-action:hover {
            background: linear-gradient(135deg, var(--red-hover) 0%, var(--red) 100%);
            transform: translateY(-1px);
            box-shadow: 0 10px 26px rgba(220,49,78,0.55);
        }
        .btn-action.hidden { display: none !important; }

        /* ── INFO BOX ── */
        .info-box {
            margin-top: 28px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            padding: 20px 24px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-dim);
            line-height: 1.6;
        }
        .info-box strong { color: var(--text); }

        /* ── ERREUR ── */
        .error {
            text-align: center;
            padding: 90px 20px;
        }
        .error h2 {
            font-size: 1.5rem;
            font-weight: 900;
            font-style: italic;
            color: var(--red);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }
        .error code {
            background: var(--bg-alt);
            padding: 4px 14px;
            border-radius: 50px;
            color: var(--text);
            font-size: 0.82rem;
            border: 1px solid var(--border);
        }
        .error a {
            display: inline-block;
            margin-top: 26px;
            color: white;
            background: linear-gradient(135deg, var(--red) 0%, #b02240 100%);
            padding: 13px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 800;
            font-style: italic;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            transition: 0.2s;
            box-shadow: 0 6px 20px var(--red-glow);
        }
        .error a:hover {
            background: linear-gradient(135deg, var(--red-hover) 0%, var(--red) 100%);
            transform: translateY(-1px);
        }

        /* ── FOOTER ── */
        footer {
            padding: 26px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            background: var(--bg);
        }
        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }
        .footer-links a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 500;
            transition: color 0.2s, background 0.2s;
            padding: 6px 14px;
            border-radius: 50px;
        }
        .footer-links a:hover {
            color: var(--text);
            background: rgba(255,255,255,0.05);
        }
        footer p {
            margin: 0;
            font-size: 0.72rem;
            color: var(--text-mute);
        }
        footer p .made { color: var(--red); font-weight: 700; font-style: italic; }

        /* ══════════════════════════════════════
           RESPONSIVE MOBILE
           ══════════════════════════════════════ */
        @media (max-width: 700px) {
            :root { --nav-height: 58px; --radius: 16px; }
            header { padding: 0 16px; gap: 8px; }
            .brand { font-size: 1.05rem; letter-spacing: -0.4px; }
            header a.back {
                padding: 8px 16px;
                font-size: 0.7rem;
                letter-spacing: 0.5px;
            }

            .wrapper { padding: 20px 14px 40px; }

            .match-header { gap: 12px; margin-bottom: 16px; }
            .match-header h2 { font-size: 1.15rem; letter-spacing: -0.5px; }
            .match-meta span { padding: 5px 12px; font-size: 0.66rem; }

            .player-box { border-radius: 14px; max-height: 55vh !important; }

            /* ═══ CLICK SHIELDS AGRANDIS ═══ */
            .click-shield.top    { height: 28% !important; }
            .click-shield.bottom { height: 12% !important; }

            .btn-action {
                padding: 12px 22px;
                font-size: 0.72rem;
                width: 100%;
                justify-content: center;
            }

            .player-wrap.langues-open .player-box {
                height: 60vh !important;
                max-height: 60vh !important;
            }

            .info-box { padding: 16px 18px; font-size: 0.78rem; margin-top: 20px; }

            footer { padding: 20px 14px; gap: 10px; }
            .footer-links { gap: 4px; }
            .footer-links a { font-size: 0.7rem; padding: 5px 10px; }
            footer p { font-size: 0.66rem; }
        }

        @media (max-width: 400px) {
            .match-header h2 { font-size: 1rem; }
            header a.back { padding: 7px 12px; font-size: 0.65rem; }
            .btn-action { padding: 11px 18px; font-size: 0.66rem; }

            .click-shield.top    { height: 32% !important; }
            .click-shield.bottom { height: 14% !important; }

            .player-wrap.langues-open .player-box {
                height: 55vh !important;
                max-height: 55vh !important;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="/index.html" class="brand">TPZ<span class="plus">+</span></a>
        <a href="/index.html" class="back">← Retour</a>
    </header>

    <div class="wrapper" id="app">
        <div class="error"><h2>⏳ Chargement…</h2></div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="/dmca.html">DMCA</a>
            <a href="/mentions.html">Terms of Service</a>
            <a href="/mentions.html">Privacy Policy</a>
            <a href="/index.html">Accueil</a>
        </div>
        <p>TPZ+ — Made by <span class="made">C3LI4N</span> with Deepseek</p>
    </footer>

    <script src="/streams.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        function getParisTime(dateStr) {
            if (!dateStr) return 0;
            if (!dateStr.includes('Z') && !dateStr.includes('+')) return new Date(dateStr + '+02:00').getTime();
            return new Date(dateStr).getTime();
        }
        function detectType(url) {
            if (/\.(m3u8|mpd)(\?|$)/i.test(url)) return 'hls';
            return 'iframe';
        }

        const params = new URLSearchParams(window.location.search);
        const matchId = params.get('id');
        const app = document.getElementById('app');
        const allIds = (window.TPZ_STREAMS || []).map(m => m.id);
        const match = (window.TPZ_STREAMS || []).find(m => m.id === matchId);

        if (!match) {
            app.innerHTML = `
                <div class="error">
                    <h2>❌ Match introuvable</h2>
                    <p style="color:#9a9aa4">ID demandé : <code>${matchId || '(vide)'}</code></p>
                    <p style="color:#9a9aa4">IDs dispo : <code>${allIds.join(', ') || '(aucun)'}</code></p>
                    <a href="/index.html">Retour</a>
                </div>`;
        } else {
            const t = getParisTime(match.heureDebut);
            const isLive = match.forceLive || !match.heureDebut || t <= Date.now();

            if (!isLive) {
                const total = Math.floor((t - Date.now()) / 1000);
                const d = Math.floor(total / 86400);
                const h = Math.floor((total % 86400) / 3600);
                const m = Math.floor((total % 3600) / 60);
                const s = total % 60;
                const f = n => n < 10 ? '0' + n : n;
                app.innerHTML = `
                    <div class="error">
                        <h2>⏳ Pas encore en direct</h2>
                        <p style="color:#9a9aa4; font-size:1.05rem; font-weight:600">
                            Début dans ${d > 0 ? d + 'J ' : ''}${f(h)}H ${f(m)}M ${f(s)}S
                        </p>
                        <a href="/index.html">Retour</a>
                    </div>`;
            } else {
                const url = match.url || (match.langues && match.langues[0] && match.langues[0].url);
                const type = detectType(url || '');

                app.innerHTML = `
                    <div class="match-header">
                        <h2>${match.nom}</h2>
                        <div class="match-meta">
                            <span class="live-tag"><div class="dot"></div> En Direct</span>
                            <span>${match.sport || 'Sport'}</span>
                            <span>${match.competition || 'Compétition'}</span>
                        </div>
                    </div>

                    <div class="player-wrap" id="player-wrap">
                        <div class="player-box" id="player"></div>
                        ${type === 'iframe' ? `
                            <div class="click-shield top"></div>
                            <div class="click-shield bottom"></div>
                        ` : ''}
                    </div>

                    ${type === 'iframe' ? `
                    <div class="player-actions">
                        <button class="btn-action" id="btn-langues">🌍 Afficher les langues</button>
                        <button class="btn-action hidden" id="btn-masquer">✖ Masquer</button>
                    </div>` : ''}

                    <div class="info-box">
                        💡 <strong>Astuce :</strong> si le flux ne se lance pas, recharge la page ou vérifie ta connexion.
                    </div>
                `;

                const player = document.getElementById('player');

                if (type === 'hls') {
                    player.innerHTML = `<video id="vid" controls autoplay playsinline style="width:100%;height:100%;background:#000"></video>`;
                    const vid = document.getElementById('vid');
                    if (window.Hls && Hls.isSupported()) {
                        const hls = new Hls();
                        hls.loadSource(url);
                        hls.attachMedia(vid);
                    } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
                        vid.src = url;
                    } else {
                        player.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888">⚠️ Flux non supporté</div>`;
                    }
                } else {
                    player.innerHTML = `<iframe src="${url}" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>`;
                }

                const wrap = document.getElementById('player-wrap');
                const btnLangues = document.getElementById('btn-langues');
                const btnMasquer = document.getElementById('btn-masquer');

                if (btnLangues && btnMasquer) {
                    btnLangues.addEventListener('click', () => {
                        wrap.classList.add('langues-open');
                        btnLangues.classList.add('hidden');
                        btnMasquer.classList.remove('hidden');
                        wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    });
                    btnMasquer.addEventListener('click', () => {
                        wrap.classList.remove('langues-open');
                        btnLangues.classList.remove('hidden');
                        btnMasquer.classList.add('hidden');
                        wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    });
                }
            }
        }

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
        };
    </script>
</body>
</html>
