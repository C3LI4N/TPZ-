<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPZ+ - Lecture</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
    :root {
        --bg: #0a0a0c;
        --accent: #38bdf8;
        --accent-glow: rgba(56,189,248,0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
        background: var(--bg); color: #fff;
        font-family: 'Poppins', sans-serif;
        display: flex; flex-direction: column; min-height: 100vh;
    }

    header {
        padding: 15px 20px; background: rgba(0,0,0,0.9);
        border-bottom: 2px solid var(--accent);
        display: flex; justify-content: space-between; align-items: center;
        position: sticky; top: 0; z-index: 50;
    }
    header h1 {
        margin: 0; font-family: 'Orbitron', sans-serif;
        font-size: 1.3rem; letter-spacing: 3px; text-transform: uppercase;
        text-shadow: 0 0 15px var(--accent-glow);
    }
    header h1 span { color: var(--accent); }
    header a {
        color: #888; text-decoration: none; font-size: 0.75rem;
        font-family: 'Orbitron', sans-serif; letter-spacing: 1px;
        border: 1px solid #333; padding: 8px 16px; border-radius: 50px;
        transition: 0.3s;
    }
    header a:hover { color: var(--accent); border-color: var(--accent); }

    .wrapper { flex: 1; width: 100%; max-width: 1600px; margin: auto; padding: 20px; }

    .match-header {
        margin-bottom: 15px; display: flex; flex-wrap: wrap;
        align-items: center; justify-content: space-between; gap: 15px;
    }
    .match-header h2 {
        font-family: 'Orbitron', sans-serif;
        font-size: 1.5rem; margin: 0; letter-spacing: 1px;
    }
    .match-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.75rem; color: #888; }
    .match-meta span {
        background: #15151a; padding: 5px 14px; border-radius: 50px;
        border: 1px solid #222; font-family: 'Orbitron', sans-serif; letter-spacing: 1px;
    }
    .live-tag {
        color: #ff4444 !important;
        border-color: rgba(255,68,68,0.3) !important;
        background: rgba(255,68,68,0.1) !important;
        display: inline-flex; align-items: center; gap: 6px;
    }
    .live-tag .dot {
        width: 7px; height: 7px; background: #ff4444;
        border-radius: 50%; animation: blink 1s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    .player-wrap {
        position: relative;
        width: 100%;
        display: block;
        margin: 0;
        padding: 0;
    }
    .player-box {
        background: #000;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #1a1a1a;
        box-shadow: 0 20px 60px var(--accent-glow);
        width: 100% !important;
        height: auto !important;
        min-height: 0 !important;
        aspect-ratio: 16 / 9 !important;
        max-height: 65vh !important;
        position: relative;
        transition: height 0.3s ease;
    }
    .player-box iframe,
    .player-box video {
        width: 100% !important; height: 100% !important;
        border: none; display: block;
    }

    .player-wrap.langues-open .player-box {
        aspect-ratio: auto !important;
        height: 80vh !important;
        max-height: 80vh !important;
    }

    .click-shield {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 3%;
        background: transparent;
        z-index: 5;
        pointer-events: auto;
    }
    .player-wrap.langues-open .click-shield { display: none; }

    .player-actions {
        margin-top: 15px;
        display: flex; gap: 10px; flex-wrap: wrap;
        justify-content: center;
    }
    .btn-action {
        background: #15151a; color: var(--accent);
        border: 1px solid rgba(56,189,248,0.3);
        padding: 14px 28px; border-radius: 50px;
        font-family: 'Orbitron', sans-serif; font-weight: 700;
        font-size: 0.8rem; cursor: pointer;
        letter-spacing: 1.5px; text-transform: uppercase;
        transition: 0.3s;
        display: inline-flex; align-items: center; gap: 10px;
    }
    .btn-action:hover {
        background: var(--accent); color: #000;
        transform: translateY(-2px);
        box-shadow: 0 8px 25px var(--accent-glow);
    }
    .btn-action.hidden { display: none !important; }

    .info-box {
        margin-top: 25px; background: #111114;
        padding: 20px; border-radius: 16px;
        border: 1px solid rgba(255,255,255,0.05);
        font-size: 0.85rem; color: #aaa; line-height: 1.6;
    }
    .info-box strong { color: var(--accent); }

    .error { text-align: center; padding: 60px 20px; }
    .error h2 {
        font-family: 'Orbitron', sans-serif;
        color: #ff4444; font-size: 1.6rem; margin-bottom: 10px;
    }
    .error code {
        background: #15151a; padding: 3px 10px; border-radius: 6px;
        color: var(--accent); font-size: 0.85rem;
    }
    .error a {
        display: inline-block; margin-top: 25px;
        color: #000; background: var(--accent);
        padding: 12px 30px; border-radius: 50px;
        text-decoration: none; font-family: 'Orbitron', sans-serif;
        font-weight: 900; font-size: 0.8rem;
    }

    footer {
        padding: 25px 15px; text-align: center; color: #444;
        font-size: 0.7rem; font-family: 'Orbitron', sans-serif;
        border-top: 1px solid rgba(255,255,255,0.03);
        margin-top: 40px;
    }
    footer .footer-links { margin-bottom: 12px; }
    footer .footer-links a {
        color: #555; text-decoration: none; font-size: 0.65rem;
        margin: 0 10px; text-transform: uppercase;
        font-family: 'Orbitron', sans-serif;
        transition: 0.2s;
    }
    footer .footer-links a:hover { color: var(--accent); }

    @media (max-width: 700px) {
        .match-header h2 { font-size: 1.15rem; }
        .player-box { border-radius: 12px; }
        .btn-action { padding: 12px 22px; font-size: 0.75rem; }
        .player-wrap.langues-open .player-box {
            height: 50vh !important;
            max-height: 50vh !important;
        }
    }
</style>
</head>
<body>

    <header>
        <h1>TPZ <span>+</span></h1>
        <a href="../index.html">← RETOUR</a>
    </header>

    <div class="wrapper" id="app">
        <div class="error"><h2>⏳ CHARGEMENT...</h2></div>
    </div>

        <footer>
        <div class="footer-links">
            <a href="../dmca.html">DMCA</a>
            <a href="../mentions.html">MENTIONS LÉGALES</a>
            <a href="../index.html">ACCUEIL</a>
        </div>
        <p style="margin:0; color:#444;">
            TPZ+ — Made by <span style="color:var(--accent)">C3LI4N</span> with Deepseek
        </p>
    </footer>

    <script src="../streams.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        function getParisTime(dateStr) {
            if (!dateStr) return 0;
            if (!dateStr.includes('Z') && !dateStr.includes('+')) return new Date(dateStr + '+02:00').getTime();
            return new Date(dateStr).getTime();
        }
        function detectType(url) {
            if (/\.(m3u8|mpd)(\?|$)/i.test(url)) return 'hls';
            return 'iframe';
        }

        const params = new URLSearchParams(window.location.search);
        const matchId = params.get('id');
        const app = document.getElementById('app');
        const allIds = (window.TPZ_STREAMS || []).map(m => m.id);
        const match = (window.TPZ_STREAMS || []).find(m => m.id === matchId);

        if (!match) {
            app.innerHTML = `
                <div class="error">
                    <h2>❌ MATCH INTROUVABLE</h2>
                    <p style="color:#888">ID demandé : <code>${matchId || '(vide)'}</code></p>
                    <p style="color:#888">IDs dispo : <code>${allIds.join(', ') || '(aucun)'}</code></p>
                    <a href="../index.html">RETOUR</a>
                </div>`;
        } else {
            const t = getParisTime(match.heureDebut);
            const isLive = match.forceLive || !match.heureDebut || t <= Date.now();

            if (!isLive) {
                const total = Math.floor((t - Date.now()) / 1000);
                const d = Math.floor(total / 86400);
                const h = Math.floor((total % 86400) / 3600);
                const m = Math.floor((total % 3600) / 60);
                const s = total % 60;
                const f = n => n < 10 ? '0' + n : n;
                app.innerHTML = `
                    <div class="error">
                        <h2>⏳ PAS ENCORE EN DIRECT</h2>
                        <p style="color:#aaa; font-size:1.2rem; font-family:'Orbitron'">
                            Début dans ${d > 0 ? d + 'J ' : ''}${f(h)}H ${f(m)}M ${f(s)}S
                        </p>
                        <a href="../index.html">RETOUR</a>
                    </div>`;
            } else {
                const url = match.url || (match.langues && match.langues[0] && match.langues[0].url);
                const type = detectType(url || '');

                app.innerHTML = `
                    <div class="match-header">
                        <h2>${match.nom}</h2>
                        <div class="match-meta">
                            <span class="live-tag"><div class="dot"></div> EN DIRECT</span>
                            <span>${match.sport || 'Sport'}</span>
                            <span>${match.competition || 'Compétition'}</span>
                        </div>
                    </div>

                    <div class="player-wrap" id="player-wrap">
                        <div class="player-box" id="player"></div>
                        ${type === 'iframe' ? '<div class="click-shield" id="click-shield"></div>' : ''}
                    </div>

                    ${type === 'iframe' ? `
                    <div class="player-actions">
                        <button class="btn-action" id="btn-langues">🌍 AFFICHER LES LANGUES</button>
                        <button class="btn-action hidden" id="btn-masquer">✖ MASQUER</button>
                    </div>` : ''}

                    <div class="info-box">
                        💡 <strong>Astuce :</strong> si le flux ne se lance pas, recharge la page ou vérifie ta connexion.
                    </div>
                `;

                const player = document.getElementById('player');

                if (type === 'hls') {
                    player.innerHTML = `<video id="vid" controls autoplay playsinline style="width:100%;height:100%;background:#000"></video>`;
                    const vid = document.getElementById('vid');
                    if (window.Hls && Hls.isSupported()) {
                        const hls = new Hls();
                        hls.loadSource(url);
                        hls.attachMedia(vid);
                    } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
                        vid.src = url;
                    } else {
                        player.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888">⚠️ Flux non supporté</div>`;
                    }
                } else {
                    player.innerHTML = `<iframe src="${url}" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>`;
                }

                const wrap = document.getElementById('player-wrap');
                const btnLangues = document.getElementById('btn-langues');
                const btnMasquer = document.getElementById('btn-masquer');

                if (btnLangues && btnMasquer) {
                    btnLangues.addEventListener('click', () => {
                        wrap.classList.add('langues-open');
                        btnLangues.classList.add('hidden');
                        btnMasquer.classList.remove('hidden');
                        wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    });

                    btnMasquer.addEventListener('click', () => {
                        wrap.classList.remove('langues-open');
                        btnLangues.classList.remove('hidden');
                        btnMasquer.classList.add('hidden');
                        wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    });
                }
            }
        }
    </script>
</body>
</html>
