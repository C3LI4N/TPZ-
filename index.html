<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPZ+ - Streaming Sportif</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <meta name="theme-color" content="#0a0a0c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TPZ+">
    <link rel="manifest" href="site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0a0a0c;
            --card: #111114;
            --accent: #38bdf8;
            --accent-glow: rgba(56,189,248,0.35);
            --text: #ffffff;
            --gray: #888;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg); color: var(--text);
            display: flex; flex-direction: column; min-height: 100vh;
            padding-bottom: 40px;
            -webkit-user-select: none; user-select: none;
        }

        /* ── HEADER ── */
        header {
            padding: 20px 25px;
            background: rgba(0,0,0,0.9);
            position: sticky; top: 0; z-index: 100;
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 5px 25px var(--accent-glow);
            display: flex; justify-content: space-between; align-items: center;
        }
        header h1 {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem; font-weight: 900;
            letter-spacing: 4px; text-transform: uppercase;
            text-shadow: 0 0 20px var(--accent-glow);
        }
        header h1 span { color: var(--accent); }

        /* ── MAIN ── */
        .main-content { padding: 0 20px; max-width: 1200px; margin: auto; width: 100%; flex: 1; }

        #no-match {
            text-align: center; padding: 100px 20px; color: #888;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .loader-ball { font-size: 2.5rem; animation: bounce 0.5s cubic-bezier(0.5, 0.05, 1, 0.5) infinite alternate; }
        @keyframes bounce { 0% { transform: translateY(0) scaleY(0.9); } 100% { transform: translateY(-25px) scaleY(1.1); } }
        .loader-text {
            font-family: 'Orbitron', sans-serif;
            animation: pulseText 1.5s infinite;
            font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
            color: var(--accent); font-size: 0.75rem;
        }
        @keyframes pulseText { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* ── TITRES ── */
        .sport-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem; font-weight: 700;
            color: var(--accent); text-transform: uppercase;
            letter-spacing: 3px; margin: 45px 0 10px 0;
            display: flex; align-items: center; gap: 15px;
        }
        .sport-title::after {
            content: ""; flex: 1; height: 1px;
            background: linear-gradient(90deg, var(--accent-glow), transparent);
        }
        .comp-title {
            font-size: 0.85rem; font-weight: 600;
            margin-bottom: 20px; color: var(--gray);
            text-transform: uppercase; letter-spacing: 1.5px;
        }

        /* ── CARTES ── */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-bottom: 40px; }

        .card {
            display: flex; align-items: center;
            background: var(--card); border-radius: 16px; padding: 15px;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card:hover { border-color: var(--accent); transform: scale(1.02); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }

        .card-img {
            width: 100px; height: 75px; border-radius: 10px;
            object-fit: cover; margin-right: 18px;
            border: 1px solid #222; background: #1a1a20;
        }
        .card-info { flex: 1; }
        .match-name { font-size: 0.95rem; font-weight: 700; margin: 0 0 12px 0; line-height: 1.3; color: #fff; }

        .btn-regarder {
            background: var(--accent); color: #000;
            border: none; padding: 10px 22px; border-radius: 50px;
            font-family: 'Orbitron', sans-serif; font-weight: 900;
            font-size: 0.7rem; cursor: pointer;
            text-transform: uppercase; transition: 0.2s;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .btn-regarder:hover { background: #fff; transform: scale(1.05); }

        .btn-attente {
            background: #222; color: #555;
            border: none; padding: 10px 22px; border-radius: 50px;
            font-family: 'Orbitron', sans-serif; font-weight: 900;
            font-size: 0.7rem; text-transform: uppercase;
        }

        .live-dot {
            font-size: 0.65rem; color: #ff4444; font-weight: 800;
            display: flex; align-items: center; gap: 6px;
            margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px;
        }
        .waiting-dot {
            font-size: 0.65rem; color: var(--gray); font-weight: 800;
            margin-bottom: 6px; text-transform: uppercase;
            letter-spacing: 1px; display: block;
        }
        .dot {
            width: 7px; height: 7px; background: #ff4444;
            border-radius: 50%; animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; box-shadow: 0 0 5px red; }
            50% { opacity: 0.3; }
        }

        /* ── FOOTER ── */
        footer {
            padding: 30px 15px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.03);
            margin-top: 50px;
        }
        .footer-links { margin-bottom: 12px; }
        .footer-links a {
            color: #555; text-decoration: none;
            font-size: 0.65rem; margin: 0 10px;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            transition: 0.2s;
        }
        .footer-links a:hover { color: var(--accent); }

        footer p {
            margin: 0;
            font-size: 0.7rem; color: #444;
            font-family: 'Orbitron', sans-serif;
        }
        footer p .made { color: var(--accent); }

        /* ── MOBILE ── */
        @media (max-width: 700px) {
            header { padding: 14px 18px; }
            header h1 { font-size: 1.4rem; letter-spacing: 3px; }
            .main-content { padding: 0 12px; }
            .grid { grid-template-columns: 1fr; gap: 14px; }
            .card { padding: 12px; }
            .card-img { width: 80px; height: 60px; margin-right: 12px; }
            .match-name { font-size: 0.88rem; }
            .btn-regarder, .btn-attente { padding: 9px 18px; font-size: 0.65rem; }
            .sport-title { font-size: 1rem; margin: 30px 0 8px 0; letter-spacing: 2px; }
            .comp-title { font-size: 0.75rem; margin-bottom: 14px; }
            footer { padding: 22px 12px; }
            .footer-links a { margin: 0 6px; font-size: 0.6rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>TPZ <span>+</span></h1>
    </header>

    <div class="main-content" id="streams-container">
        <div id="no-match">
            <div class="loader-ball">⚽</div>
            <div class="loader-text">Initialisation des flux...</div>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="dmca.html">DMCA</a>
            <a href="mentions.html">MENTIONS LÉGALES</a>
            <a href="index.html">ACCUEIL</a>
        </div>
        <p>
            <span id="tpz-clock">--:--:--</span> ·
            TPZ+ — Made by <span class="made">C3LI4N</span> with Deepseek
        </p>
    </footer>

    <script src="streams.js"></script>
    <script>
        // ── Image fallback (SVG inline base64) ──
        const FALLBACK_IMG = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iNzUiPjxyZWN0IHdpZHRoPSIxMDAiIGhlaWdodD0iNzUiIGZpbGw9IiMxMTEiLz48dGV4dCB4PSI1MCIgeT0iNDIiIGZpbGw9IiMzOGJkZjgiIGZvbnQtZmFtaWx5PSJPcmJpdHJvbixzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5UUFo8L3RleHQ+PC9zdmc+";

        function getParisTime(dateStr) {
            if (!dateStr) return 0;
            if (!dateStr.includes('Z') && !dateStr.includes('+')) return new Date(dateStr + '+02:00').getTime();
            return new Date(dateStr).getTime();
        }

        // ── Viewers simulés ──
        window.tpzViewers = JSON.parse(localStorage.getItem('tpzViewers') || '{}');

        function refreshViewers() {
            (window.TPZ_STREAMS || []).forEach(m => {
                if (!window.tpzViewers[m.id]) {
                    window.tpzViewers[m.id] = Math.floor(Math.random() * 800) + 200;
                } else {
                    window.tpzViewers[m.id] += Math.floor(Math.random() * 40) - 20;
                    if (window.tpzViewers[m.id] < 50) window.tpzViewers[m.id] = 50;
                }
            });
            localStorage.setItem('tpzViewers', JSON.stringify(window.tpzViewers));
            updateViewersUI();
        }

        function updateViewersUI() {
            document.querySelectorAll('[id^="count-"]').forEach(el => {
                const id = el.id.replace('count-', '');
                el.innerText = (window.tpzViewers[id] || 0).toLocaleString('fr-FR');
            });
        }

        // ── Rendu ──
        function renderStreams() {
            const cont = document.getElementById('streams-container');
            const streams = (window.TPZ_STREAMS || []).filter(m => m.visible !== false);

            if (!streams.length) {
                cont.innerHTML = '<div id="no-match"><div class="loader-ball">⚽</div><div class="loader-text">Aucun match programmé</div></div>';
                return;
            }

            streams.sort((a, b) => (a.priorite || 99) - (b.priorite || 99));

            const groups = {};
            streams.forEach(m => {
                const s = m.sport || "Autres";
                const c = m.competition || "Direct";
                if (!groups[s]) groups[s] = {};
                if (!groups[s][c]) groups[s][c] = [];
                groups[s][c].push(m);
            });

            let html = '';
            for (const s in groups) {
                html += `<div class="sport-title">${s}</div>`;
                for (const c in groups[s]) {
                    html += `<div class="comp-title">${c}</div><div class="grid">`;
                    groups[s][c].forEach(m => {
                        let statusHtml, buttonHtml, badgeHtml;
                        let isLive = true, isCountdown = false;

                        if (m.forceLive) isLive = true;
                        else if (m.heureDebut) {
                            if (getParisTime(m.heureDebut) > Date.now()) { isLive = false; isCountdown = true; }
                        }

                        if (isLive) {
                            statusHtml = `<div class="live-dot"><div class="dot"></div> EN DIRECT</div>`;
                            badgeHtml = `<div style="position:absolute;top:15px;right:20px;font-family:'Orbitron',sans-serif;color:#ddd;font-size:0.7rem;font-weight:700;">👁️ <span id="count-${m.id}">0</span></div>`;
                            buttonHtml = `<button onclick="openMatch('${m.id}')" class="btn-regarder">REGARDER</button>`;
                        } else {
                            statusHtml = isCountdown
                                ? `<div class="waiting-dot match-timer" data-time="${m.heureDebut}" data-id="${m.id}" data-live="false">⏳ CALCUL...</div>`
                                : `<div class="waiting-dot">⏳ BIENTÔT</div>`;
                            badgeHtml = '';
                            buttonHtml = `<button class="btn-attente" disabled>BIENTÔT</button>`;
                        }

                        html += `
                        <div class="card" id="card-${m.id}" style="${isLive ? '' : 'opacity: 0.7;'}">
                            <img src="${m.image || FALLBACK_IMG}" class="card-img" onerror="this.onerror=null;this.src='${FALLBACK_IMG}'">
                            <div class="card-info">
                                ${statusHtml}
                                <h3 class="match-name">${m.nom}</h3>
                                ${buttonHtml}
                            </div>
                            ${badgeHtml}
                        </div>`;
                    });
                    html += `</div>`;
                }
            }

            cont.innerHTML = html;
            updateViewersUI();
        }

        window.openMatch = function(id) {
            window.location.href = 'vip/index.html?id=' + encodeURIComponent(id);
        };

        // ── Compte à rebours ──
        setInterval(() => {
            const now = Date.now();
            document.querySelectorAll('.match-timer').forEach(el => {
                if (el.dataset.live === "true") return;
                const diff = getParisTime(el.dataset.time) - now;
                if (diff > 0) {
                    const t = Math.floor(diff / 1000);
                    const d = Math.floor(t / 86400);
                    const h = Math.floor((t % 86400) / 3600);
                    const m = Math.floor((t % 3600) / 60);
                    const s = t % 60;
                    const f = n => n < 10 ? '0' + n : n;
                    el.innerHTML = `⏳ ${d > 0 ? d + 'J ' : ''}${f(h)}H ${f(m)}M ${f(s)}S`;
                } else {
                    location.reload();
                }
            });
        }, 1000);

        // ── Horloge footer ──
        (function(){
            function tick(){
                const el = document.getElementById('tpz-clock');
                if (!el) return;
                const d = new Date();
                const f = n => n < 10 ? '0' + n : n;
                el.textContent = `${f(d.getHours())}:${f(d.getMinutes())}:${f(d.getSeconds())}`;
            }
            tick();
            setInterval(tick, 1000);
        })();

        // ── Init ──
        renderStreams();
        refreshViewers();
        setInterval(refreshViewers, 60000);

        // ── Blocages ──
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
        };
    </script>
</body>
</html>
