<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPZ+ — Streaming Sportif</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TPZ+">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #08080a;
            --bg-alt: #101014;
            --bg-elev: #16161c;
            --bg-glass: rgba(22, 22, 28, 0.65);
            --border: rgba(255,255,255,0.07);
            --border-strong: rgba(255,255,255,0.16);
            --text: #ffffff;
            --text-dim: #9a9aa4;
            --text-mute: #5a5a64;
            --red: #dc314e;
            --red-hover: #f46e84;
            --red-glow: rgba(220,49,78,0.35);
            --cyan: #67e8f9;
            --green: #22c55e;
            --nav-height: 64px;
            --radius: 20px;
            --radius-sm: 14px;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex; flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -webkit-user-select: none; user-select: none;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 55% 45% at 15% 0%, rgba(220,49,78,0.08), transparent 60%),
                radial-gradient(ellipse 50% 40% at 100% 100%, rgba(103,232,249,0.05), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        body > * { position: relative; z-index: 1; }

        /* ── NAVBAR ── */
        header {
            padding: 0 28px;
            height: var(--nav-height);
            background: rgba(8,8,10,0.75);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
            gap: 20px;
        }
        .brand {
            display: flex; align-items: center; gap: 6px;
            font-weight: 900;
            font-size: 1.35rem;
            font-style: italic;
            letter-spacing: -0.6px;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text);
            flex-shrink: 0;
        }
        .brand .plus { color: var(--red); }

        .clock {
            display: flex; flex-direction: column;
            align-items: flex-end;
            line-height: 1;
            margin-left: auto;
        }
        .clock .time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text);
        }
        .clock .date {
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-mute);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 4px;
        }

        /* ── MAIN ── */
        .main {
            padding: 36px 28px 70px;
            max-width: 1500px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        /* ── HERO ── */
        .hero {
            display: flex; flex-wrap: wrap;
            align-items: flex-end; justify-content: space-between;
            gap: 20px;
            margin-bottom: 32px;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--border);
        }
        .hero-text h1 {
            font-size: 2.4rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -1.5px;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            line-height: 1;
        }
        .hero-text h1 .accent {
            color: var(--red);
            text-shadow: 0 0 30px var(--red-glow);
        }
        .hero-text p {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin: 0;
            font-weight: 500;
        }
        .hero-stats {
            display: flex; gap: 12px;
            flex-wrap: wrap;
        }
        .stat {
            display: flex; flex-direction: column;
            gap: 3px;
            padding: 12px 20px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            min-width: 110px;
        }
        .stat .num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1;
        }
        .stat .num.red { color: var(--red); text-shadow: 0 0 20px var(--red-glow); }
        .stat .num.cyan { color: var(--cyan); }
        .stat .lbl {
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--text-mute);
            text-transform: uppercase;
            letter-spacing: 1.8px;
        }

        /* ══════════════════════════════════════
           TABS (Matchs / Chaînes TV)
           ══════════════════════════════════════ */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 28px;
            padding: 6px;
            background: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: 50px;
            width: fit-content;
            max-width: 100%;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 11px 24px;
            border-radius: 50px;
            font-family: inherit;
            font-weight: 800;
            font-style: italic;
            font-size: 0.8rem;
            letter-spacing: 0.8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.25s;
            display: inline-flex; align-items: center; gap: 8px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .tab:hover {
            color: var(--text);
            background: rgba(255,255,255,0.04);
        }
        .tab.active {
            background: linear-gradient(135deg, var(--red) 0%, #b02240 100%);
            color: white;
            box-shadow: 0 6px 20px var(--red-glow);
        }
        .tab .tab-count {
            background: rgba(255,255,255,0.15);
            padding: 2px 8px;
            border-radius: 50px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0;
        }
        .tab.active .tab-count {
            background: rgba(0,0,0,0.25);
        }

        /* ── PANELS ── */
        .panel { display: none; }
        .panel.active { display: block; }

        /* ── LOADER ── */
        #no-match, #no-channels {
            text-align: center;
            padding: 100px 20px;
            color: var(--text-dim);
            display: flex; flex-direction: column;
            align-items: center; gap: 18px;
        }
        .loader-ball {
            font-size: 3rem;
            animation: bounce 0.6s cubic-bezier(0.5, 0.05, 1, 0.5) infinite alternate;
            filter: drop-shadow(0 0 20px var(--red-glow));
        }
        @keyframes bounce {
            0% { transform: translateY(0) scaleY(0.9); }
            100% { transform: translateY(-24px) scaleY(1.1); }
        }
        .loader-text {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-mute);
            animation: pulseText 1.5s infinite;
        }
        @keyframes pulseText { 0%,100%{opacity:1} 50%{opacity:.4} }

        /* ── SECTIONS ── */
        .section { margin-bottom: 12px; }
        .section-head {
            display: flex; align-items: center;
            gap: 12px;
            margin: 40px 0 20px 0;
        }
        .section-head .emoji {
            font-size: 1.4rem;
            filter: drop-shadow(0 0 10px rgba(220,49,78,0.3));
        }
        .section-head h2 {
            font-size: 1.45rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.7px;
            text-transform: uppercase;
            font-style: italic;
        }
        .section-head .count {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--red);
            background: rgba(220,49,78,0.08);
            border: 1px solid rgba(220,49,78,0.25);
            padding: 4px 12px;
            border-radius: 50px;
            margin-left: 6px;
            letter-spacing: 1px;
            font-family: 'JetBrains Mono', monospace;
        }
        .section-head::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border-strong), transparent);
            margin-left: 12px;
        }

        .comp-head {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-mute);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 24px 0 14px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .comp-head::before {
            content: "";
            width: 6px; height: 6px;
            background: var(--red);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--red-glow);
        }

        /* ── GRILLE ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 14px;
        }

        /* ── CARTES MATCH ── */
        .card {
            display: flex;
            align-items: stretch;
            background: var(--bg-glass);
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
            transition: background 0.25s, border-color 0.25s, transform 0.2s;
        }
        .card:hover {
            background: var(--bg-elev);
            border-color: var(--border-strong);
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .card::before {
            content: "";
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: var(--red);
            opacity: 0;
            transition: opacity 0.25s;
            box-shadow: 0 0 16px var(--red-glow);
        }
        .card.live::before { opacity: 1; }
        .card.live {
            box-shadow: inset 4px 0 0 0 rgba(220,49,78,0.15);
        }
        .card.live:hover {
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 4px 0 0 0 rgba(220,49,78,0.25);
        }

        .card-img {
            width: 108px;
            min-height: 96px;
            object-fit: cover;
            background: #1a1a20;
            flex-shrink: 0;
            border-right: 1px solid var(--border);
        }
        .card-info {
            flex: 1;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }
        .match-name {
            font-size: 0.95rem;
            font-weight: 800;
            font-style: italic;
            margin: 0 0 12px 0;
            line-height: 1.25;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: -0.3px;
        }

        /* ── BOUTONS ── */
        .btn-regarder {
            background: linear-gradient(135deg, var(--red) 0%, #b02240 100%);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 50px;
            font-family: inherit;
            font-weight: 800;
            font-style: italic;
            font-size: 0.78rem;
            letter-spacing: 0.8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
            align-self: flex-start;
            box-shadow: 0 6px 20px var(--red-glow);
        }
        .btn-regarder:hover {
            background: linear-gradient(135deg, var(--red-hover) 0%, var(--red) 100%);
            transform: translateY(-1px);
            box-shadow: 0 10px 26px rgba(220,49,78,0.5);
        }

        .btn-attente {
            background: rgba(255,255,255,0.04);
            color: var(--text-mute);
            border: 1px solid var(--border);
            padding: 10px 22px;
            border-radius: 50px;
            font-family: inherit;
            font-weight: 800;
            font-style: italic;
            font-size: 0.78rem;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: not-allowed;
            align-self: flex-start;
        }

        /* ── STATUTS ── */
        .live-dot {
            display: inline-flex; align-items: center; gap: 7px;
            font-size: 0.62rem;
            font-weight: 800;
            color: var(--red);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 10px;
            background: rgba(220,49,78,0.1);
            border: 1px solid rgba(220,49,78,0.3);
            padding: 4px 12px;
            border-radius: 50px;
            align-self: flex-start;
        }
        .live-dot .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--red);
            animation: blink 1.2s infinite;
            box-shadow: 0 0 10px var(--red);
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

        .waiting-dot {
            display: inline-flex;
            font-size: 0.62rem;
            font-weight: 800;
            color: var(--text-mute);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            padding: 4px 12px;
            border-radius: 50px;
            align-self: flex-start;
        }

        /* ── CARTES CHAÎNES ── */
        .channels-grid {
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }
        .channel-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            transition: 0.25s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
        }
        .channel-card:hover {
            background: var(--bg-elev);
            border-color: var(--border-strong);
            transform: translateY(-2px);
        }
        .channel-card.offline { opacity: 0.4; cursor: not-allowed; }
        .channel-card.offline:hover { transform: none; }
        .channel-img {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: contain;
            background: #fff;
            padding: 4px;
            flex-shrink: 0;
            border: 1px solid var(--border);
        }
        .channel-info { flex: 1; min-width: 0; }
        .channel-name {
            font-size: 0.85rem;
            font-weight: 700;
            font-style: italic;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: -0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }
        .channel-status {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.58rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .channel-status.online { color: var(--red); }
        .channel-status.offline { color: var(--text-mute); }
        .channel-status .dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: currentColor;
        }
        .channel-status.online .dot {
            animation: blink 1.2s infinite;
            box-shadow: 0 0 6px var(--red);
        }

        /* ── FOOTER ── */
        footer {
            padding: 26px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            background: var(--bg);
        }
        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }
        .footer-links a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 500;
            transition: color 0.2s, background 0.2s;
            padding: 6px 14px;
            border-radius: 50px;
        }
        .footer-links a:hover {
            color: var(--text);
            background: rgba(255,255,255,0.05);
        }
        footer p {
            margin: 0;
            font-size: 0.72rem;
            color: var(--text-mute);
        }
        footer p .made { color: var(--red); font-weight: 700; font-style: italic; }

        .external-sources {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            align-items: center;
            padding: 12px 16px;
            background: rgba(220,49,78,0.05);
            border: 1px solid rgba(220,49,78,0.18);
            border-radius: 50px;
            font-size: 0.72rem;
        }
        .external-sources .label {
            color: var(--text-mute);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1.5px;
            font-size: 0.6rem;
        }
        .external-sources a {
            color: var(--red);
            text-decoration: none;
            font-weight: 800;
            font-style: italic;
            padding: 4px 12px;
            border-radius: 50px;
            background: rgba(220,49,78,0.08);
            border: 1px solid rgba(220,49,78,0.25);
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.7rem;
        }
        .external-sources a:hover {
            background: var(--red);
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px var(--red-glow);
        }

        /* ══════════════════════════════════════
           RESPONSIVE MOBILE
           ══════════════════════════════════════ */
        @media (max-width: 900px) {
            .main { padding: 28px 20px 60px; }
            .hero-text h1 { font-size: 1.9rem; }
        }

        @media (max-width: 700px) {
            :root { --nav-height: 58px; --radius: 16px; --radius-sm: 12px; }
            header { padding: 0 16px; gap: 10px; }
            .brand { font-size: 1.05rem; letter-spacing: -0.4px; }
            .clock .time { font-size: 0.9rem; letter-spacing: 0.5px; }
            .clock .date { font-size: 0.5rem; letter-spacing: 1px; margin-top: 3px; }

            .main { padding: 20px 14px 50px; }

            .hero {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
                margin-bottom: 24px;
                padding-bottom: 20px;
            }
            .hero-text h1 { font-size: 1.5rem; letter-spacing: -0.8px; }
            .hero-text p { font-size: 0.78rem; line-height: 1.5; }
            .hero-stats { gap: 10px; width: 100%; }
            .stat { flex: 1; min-width: 0; padding: 10px 14px; }
            .stat .num { font-size: 1.25rem; }
            .stat .lbl { font-size: 0.55rem; letter-spacing: 1.3px; }

            /* Tabs mobile */
            .tabs {
                width: 100%;
                margin-bottom: 20px;
                padding: 5px;
            }
            .tab {
                padding: 10px 18px;
                font-size: 0.72rem;
                flex: 1;
                justify-content: center;
            }
            .tab .tab-count { font-size: 0.62rem; padding: 2px 6px; }

            .section-head { margin: 28px 0 14px 0; gap: 8px; }
            .section-head .emoji { font-size: 1.15rem; }
            .section-head h2 { font-size: 1.1rem; letter-spacing: -0.4px; }
            .section-head .count { font-size: 0.58rem; padding: 3px 9px; }
            .comp-head { font-size: 0.65rem; margin: 16px 0 10px 0; letter-spacing: 1.5px; }

            .grid { grid-template-columns: 1fr; gap: 10px; }

            .card-img { width: 86px; min-height: 82px; }
            .card-info { padding: 12px 14px; }
            .match-name { font-size: 0.86rem; margin-bottom: 10px; }
            .btn-regarder, .btn-attente { padding: 8px 16px; font-size: 0.7rem; }
            .live-dot, .waiting-dot { font-size: 0.58rem; padding: 3px 9px; margin-bottom: 7px; }

            .channels-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 10px;
            }
            .channel-card { padding: 12px; gap: 10px; }
            .channel-img { width: 42px; height: 42px; }
            .channel-name { font-size: 0.76rem; }

            footer { padding: 20px 14px; gap: 10px; }
            .footer-links { gap: 4px; }
            .footer-links a { font-size: 0.7rem; padding: 5px 10px; }
            footer p { font-size: 0.66rem; text-align: center; }
            .external-sources { font-size: 0.65rem; padding: 10px 12px; gap: 6px; }
        }


        @media (max-width: 400px) {
            .brand { font-size: 0.95rem; }
            .clock .time { font-size: 0.8rem; }
            .hero-text h1 { font-size: 1.25rem; }
            .card-img { width: 74px; min-height: 74px; }
            .card-info { padding: 10px 12px; }
            .match-name { font-size: 0.8rem; }
            .btn-regarder, .btn-attente { padding: 7px 14px; font-size: 0.65rem; }
            .channels-grid { grid-template-columns: 1fr 1fr; }
            .tab { padding: 9px 14px; font-size: 0.66rem; }
        }
    </style>
</head>
<body>

    <header>
        <a href="/index.html" class="brand">TPZ<span class="plus">+</span></a>
        <div class="clock">
            <span class="time" id="tpz-clock">--:--:--</span>
            <span class="date" id="tpz-date">—</span>
        </div>
    </header>

    <div class="main">
        <div class="hero">
            <div class="hero-text">
                <h1>TPZ<span class="accent">+</span></h1>
                <p>Matchs en direct et chaînes TV — mis à jour en temps réel.</p>
            </div>
            <div class="hero-stats">
                <div class="stat">
                    <span class="num red" id="stat-live">0</span>
                    <span class="lbl">En direct</span>
                </div>
                <div class="stat">
                    <span class="num cyan" id="stat-total">0</span>
                    <span class="lbl">Programmés</span>

            </div>

        <!-- ══════════ ONGLETS ══════════ -->
        <div class="tabs" role="tablist">
            <button class="tab active" data-panel="matches" role="tab">
                ⚽ Matchs
                <span class="tab-count" id="tab-count-matches">0</span>

            <button class="tab" data-panel="channels" role="tab">
                📺 Chaînes TV

        <!-- ══════════ PANEL MATCHS ══════════ -->

            <div id="streams-content">

                    <div class="loader-ball">⚽</div>

        <!-- ══════════ PANEL CHAÎNES ══════════ -->
        <div class="panel" id="panel-channels">
            <div class="grid channels-grid" id="channels-content">
                <div id="no-channels">
                    <div class="loader-ball">📺</div>
                    <div class="loader-text">Chargement des chaînes…</div>

    <script src="/streams.js"></script>
    <script src="/channels.js"></script>
    <script>
        const FALLBACK_IMG = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iNzUiPjxyZWN0IHdpZHRoPSIxMDAiIGhlaWdodD0iNzUiIGZpbGw9IiMxMzEzMTMiLz48dGV4dCB4PSI1MCIgeT0iNDMiIGZpbGw9IiM2YjZiNmIiIGZvbnQtZmFtaWx5PSJBcmlhbCxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE2IiBmb250LXdlaWdodD0iNzAwIiBmb250LXN0eWxlPSJpdGFsaWMiIHRleHQtYW5jaG9yPSJtaWRkbGUiPlRQWis8L3RleHQ+PC9zdmc+";

        function getParisTime(dateStr) {
            if (!dateStr) return 0;
            if (!dateStr.includes('Z') && !dateStr.includes('+')) return new Date(dateStr + '+02:00').getTime();
            return new Date(dateStr).getTime();
        }

        /* ══════════ MATCHS ══════════ */
        function renderStreams() {
            const cont = document.getElementById('streams-content');
            const tabCount = document.getElementById('tab-count-matches');
            const streams = (window.TPZ_STREAMS || []).filter(m => m.visible !== false);

            if (tabCount) tabCount.textContent = streams.length;

            if (!streams.length) {
                cont.innerHTML = '<div id="no-match"><div class="loader-ball">⚽</div><div class="loader-text">Aucun match programmé</div></div>';
                updateStats(0, 0);
                return;
            }

            streams.sort((a, b) => (a.priorite || 99) - (b.priorite || 99));

            const groups = {};
            streams.forEach(m => {
                const s = m.sport || "Autres";
                const c = m.competition || "Direct";
                if (!groups[s]) groups[s] = {};
                if (!groups[s][c]) groups[s][c] = [];
                groups[s][c].push(m);
            });

            let html = '';
            let liveCount = 0;
            const totalCount = streams.length;

            for (const s in groups) {
                const emojiMatch = s.match(/^(\p{Emoji_Presentation}|\p{Extended_Pictographic})\s*/u);
                const emoji = emojiMatch ? emojiMatch[1] : '🏆';
                const sportLabel = emojiMatch ? s.replace(emojiMatch[0], '') : s;
                const sportTotal = Object.values(groups[s]).flat().length;

                html += `
                    <div class="section">
                        <div class="section-head">
                            <span class="emoji">${emoji}</span>
                            <h2>${sportLabel}</h2>
                            <span class="count">${sportTotal}</span>
                        </div>`;

                for (const c in groups[s]) {
                    html += `<div class="comp-head">${c}</div><div class="grid">`;

                    groups[s][c].forEach(m => {
                        let statusHtml, buttonHtml;
                        let isLive = true, isCountdown = false;

                        if (m.forceLive) isLive = true;
                        else if (m.heureDebut) {
                            if (getParisTime(m.heureDebut) > Date.now()) { isLive = false; isCountdown = true; }
                        }

                        if (isLive) {
                            liveCount++;
                            statusHtml = `<div class="live-dot"><div class="dot"></div> En Direct</div>`;
                            buttonHtml = `<button onclick="openMatch('${m.id}')" class="btn-regarder">Regarder</button>`;
                        } else {
                            statusHtml = isCountdown
                                ? `<div class="waiting-dot match-timer" data-time="${m.heureDebut}" data-id="${m.id}" data-live="false">⏳ Calcul…</div>`
                                : `<div class="waiting-dot">⏳ Bientôt</div>`;
                            buttonHtml = `<button class="btn-attente" disabled>Bientôt</button>`;
                        }

                        html += `
                        <div class="card ${isLive ? 'live' : ''}" id="card-${m.id}" style="${isLive ? '' : 'opacity: 0.55;'}">
                            <img src="${m.image || FALLBACK_IMG}" class="card-img" onerror="this.onerror=null;this.src='${FALLBACK_IMG}'">
                            <div class="card-info">
                                ${statusHtml}
                                <h3 class="match-name">${m.nom}</h3>
                                ${buttonHtml}
                            </div>
                        </div>`;
                    });
                    html += `</div>`;
                }
                html += `</div>`;
            }

            cont.innerHTML = html;
            updateStats(liveCount, totalCount);
        }

        function updateStats(live, total) {
            document.getElementById('stat-live').textContent = live;
            document.getElementById('stat-total').textContent = total;
        }

        window.openMatch = function(id) {
            window.location.href = '/vip/index.html?id=' + encodeURIComponent(id);
        };

        /* ══════════ CHAÎNES TV ══════════ */
        async function renderChannels() {
            const cont = document.getElementById('channels-content');
            const tabCount = document.getElementById('tab-count-channels');

            if (!window.TPZ_CHANNELS_LOADED) {
                await loadChannels();
            }

            const channels = window.TPZ_CHANNELS || [];

            if (tabCount) tabCount.textContent = channels.length;

            if (!channels.length) {
                cont.innerHTML = '<div id="no-channels"><div class="loader-ball">📺</div><div class="loader-text">Aucune chaîne disponible</div></div>';
                return;
            }

                        cont.innerHTML = channels.map(ch => {
                const isOnline = ch.status === 'online';
                const link = isOnline
                    ? `/channels-player.html?name=${encodeURIComponent(ch.name)}&url=${encodeURIComponent(ch.url)}&img=${encodeURIComponent(ch.image)}`
                    : '#';
                                const link = isOnline
                    ? `/channels-player.html?name=${encodeURIComponent(ch.name)}&url=${encodeURIComponent(ch.url)}`
                    : '#';
                return `
                    <a class="channel-card ${isOnline ? '' : 'offline'}" href="${link}">
                        <img class="channel-img"
                             src="${ch.image}"
                             alt="${ch.name}"
                             onerror="this.onerror=null;this.src='${FALLBACK_IMG}'">
                        <div class="channel-info">
                            <h3 class="channel-name">${ch.name}</h3>
                            <span class="channel-status ${isOnline ? 'online' : 'offline'}">
                                <span class="dot"></span>
                                ${isOnline ? 'En ligne' : 'Hors ligne'}
                            </span>
                        </div>
                    </a>
                `;
            }).join('');
        }

        /* ══════════ TABS ══════════ */
        function initTabs() {
            const tabs = document.querySelectorAll('.tab');
            const panels = document.querySelectorAll('.panel');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    panels.forEach(p => p.classList.remove('active'));

                    tab.classList.add('active');
                    const target = document.getElementById('panel-' + tab.dataset.panel);
                    if (target) target.classList.add('active');
                });
            });
        }

        /* ══════════ HORLOGE ══════════ */
        (function(){
            const DAYS = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
            const MONTHS = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
            function tick(){
                const timeEl = document.getElementById('tpz-clock');
                const dateEl = document.getElementById('tpz-date');
                if (!timeEl) return;
                const d = new Date();
                const f = n => n < 10 ? '0' + n : n;
                timeEl.textContent = `${f(d.getHours())}:${f(d.getMinutes())}:${f(d.getSeconds())}`;
                dateEl.textContent = `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
            }
            tick();
            setInterval(tick, 1000);
        })();

        /* ══════════ COMPTE À REBOURS ══════════ */
        setInterval(() => {
            const now = Date.now();
            document.querySelectorAll('.match-timer').forEach(el => {
                if (el.dataset.live === "true") return;
                const diff = getParisTime(el.dataset.time) - now;
                if (diff > 0) {
                    const t = Math.floor(diff / 1000);
                    const d = Math.floor(t / 86400);
                    const h = Math.floor((t % 86400) / 3600);
                    const m = Math.floor((t % 3600) / 60);
                    const s = t % 60;
                    const f = n => n < 10 ? '0' + n : n;
                    el.innerHTML = `⏳ ${d > 0 ? d + 'J ' : ''}${f(h)}H ${f(m)}M ${f(s)}S`;
                } else {
                    location.reload();
                }
            });
        }, 1000);

        /* ══════════ INIT ══════════ */
        initTabs();
        renderStreams();
        renderChannels();

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
        };
    </script>
</body>
