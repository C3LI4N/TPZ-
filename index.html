<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TPZ+</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="TPZ+">
<link rel="manifest" href="/site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0a0a;
  --glass:rgba(255,255,255,.02);
  --glass-strong:rgba(255,255,255,.04);
  --hair:rgba(255,255,255,.08);
  --hair-strong:rgba(255,255,255,.14);
  --text:#f5f5f5;
  --text2:#8a8a8a;
  --text3:#5a5a5a;
  --red:#ff0033;
  --red-hover:#e00029;
  --radius:10px;
  --radius-sm:6px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg)}
body{
  font-family:'Inter',-apple-system,system-ui,sans-serif;
  color:var(--text);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* Ambient backdrop */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 50% 40% at 20% 0%, rgba(255,0,51,.06), transparent 60%),
    radial-gradient(ellipse 50% 40% at 100% 100%, rgba(120,140,255,.04), transparent 60%);
  pointer-events:none;
  z-index:0;
}
body > *{position:relative;z-index:1}

/* ── NAV GLASS ── */
.nav{
  position:sticky;
  top:0;
  z-index:100;
  height:60px;
  padding:0 24px;
  display:flex;
  align-items:center;
  gap:24px;
  background:rgba(10,10,10,.65);
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  border-bottom:1px solid var(--hair);
}
.brand{
  display:flex;
  align-items:baseline;
  gap:1px;
  font-size:17px;
  font-weight:700;
  letter-spacing:-.3px;
  flex-shrink:0;
}
.brand .plus{color:var(--red)}

.tabs{
  display:flex;
  gap:4px;
  margin-left:16px;
  flex:1;
}
.tab{
  padding:8px 14px;
  border-radius:var(--radius-sm);
  font-size:14px;
  font-weight:500;
  color:var(--text2);
  transition:color .2s, background .2s;
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.tab:hover{color:var(--text)}
.tab.active{
  color:var(--text);
  background:var(--glass-strong);
}
.tab-count{
  font-size:12px;
  color:var(--text3);
  font-variant-numeric:tabular-nums;
  font-weight:400;
}
.tab.active .tab-count{color:var(--text2)}

.clock{
  font-size:13px;
  color:var(--text2);
  font-variant-numeric:tabular-nums;
  font-weight:500;
  flex-shrink:0;
}

/* ── MAIN ── */
main{
  flex:1;
  max-width:1240px;
  width:100%;
  margin:0 auto;
  padding:32px 24px 60px;
}

.panel{display:none}
.panel.active{display:block}

/* Section header */
.section{
  margin-bottom:36px;
}
.section-head{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin-bottom:14px;
}
.section-head h2{
  font-size:14px;
  font-weight:600;
  letter-spacing:.3px;
  text-transform:uppercase;
  color:var(--text);
}
.section-head .count{
  font-size:12px;
  color:var(--text3);
  font-variant-numeric:tabular-nums;
}
.comp-label{
  font-size:12px;
  font-weight:500;
  color:var(--text3);
  text-transform:uppercase;
  letter-spacing:.5px;
  margin:20px 0 10px;
}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:8px;
}
.channels-grid{
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
}

/* Match card */
.match{
  display:flex;
  background:var(--glass);
  border:1px solid var(--hair);
  border-radius:var(--radius);
  overflow:hidden;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  transition:border-color .2s, background .2s;
}
.match:hover{
  border-color:var(--hair-strong);
  background:var(--glass-strong);
}
.match-img{
  width:76px;
  min-height:76px;
  object-fit:cover;
  background:#141414;
  flex-shrink:0;
  border-right:1px solid var(--hair);
}
.match-body{
  flex:1;
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:6px;
  min-width:0;
}
.status{
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.6px;
  display:flex;
  align-items:center;
  gap:6px;
}
.status.live{color:var(--red)}
.status.waiting{color:var(--text3)}
.status-dot{
  width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;
}
.status.live .status-dot{animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.match-name{
  font-size:14px;
  font-weight:500;
  line-height:1.3;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.btn-watch{
  background:var(--red);
  color:#fff;
  padding:6px 12px;
  border-radius:var(--radius-sm);
  font-size:12px;
  font-weight:500;
  align-self:flex-start;
  transition:background .2s;
}
.btn-watch:hover{background:var(--red-hover)}
.btn-soon{
  background:transparent;
  color:var(--text3);
  border:1px solid var(--hair);
  padding:6px 12px;
  border-radius:var(--radius-sm);
  font-size:12px;
  font-weight:500;
  align-self:flex-start;
  cursor:not-allowed;
}

/* Channel card */
.channel{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--glass);
  border:1px solid var(--hair);
  border-radius:var(--radius);
  padding:12px;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  transition:border-color .2s, background .2s;
}
.channel:hover{
  border-color:var(--hair-strong);
  background:var(--glass-strong);
}
.channel.offline{opacity:.4;pointer-events:none}
.channel-logo{
  width:36px;height:36px;border-radius:var(--radius-sm);
  object-fit:contain;background:#fff;padding:3px;flex-shrink:0;
}
.channel-info{flex:1;min-width:0}
.channel-name{
  font-size:13px;
  font-weight:500;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.channel-meta{
  font-size:11px;
  color:var(--text3);
  margin-top:2px;
}

/* Loader */
.loader{
  text-align:center;
  padding:64px 20px;
  color:var(--text3);
  font-size:14px;
}

/* Footer */
footer{
  border-top:1px solid var(--hair);
  padding:24px;
  font-size:12px;
  color:var(--text3);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}
.foot-nav{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px 18px;
}
.foot-nav a{color:var(--text3)}
.foot-nav a:hover{color:var(--text2)}
.foot-sources{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:8px;
  color:var(--text3);
}
.foot-sources span{color:var(--text3)}
.foot-sources a{
  color:var(--text2);
  text-decoration:underline;
  text-underline-offset:2px;
}
.foot-sources a:hover{color:var(--text)}

/* ── INTRO ANIMATION ── */
html.intro .nav{opacity:0;transform:translateY(-9px)}
html.intro main > *{opacity:0;transform:translateY(12px)}
html.intro footer{opacity:0}
.nav, main > *, footer{
  transition:opacity .6s cubic-bezier(.16,1,.3,1),
             transform .6s cubic-bezier(.16,1,.3,1);
}

/* Mobile */
@media (max-width:700px){
  .nav{padding:0 14px;gap:12px;height:56px}
  .brand{font-size:15px}
  .tabs{margin-left:4px;gap:2px}
  .tab{padding:6px 10px;font-size:13px}
  .tab-count{display:none}
  main{padding:20px 14px 40px}
  .grid{grid-template-columns:1fr}
  .channels-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .match-img{width:64px;min-height:64px}
}
</style>

<script>
  document.documentElement.classList.add('intro');
  setTimeout(() => document.documentElement.classList.remove('intro'), 800);
</script>
</head>
<body>

<nav class="nav">
  <a href="/" class="brand">TPZ<span class="plus">+</span></a>
  <div class="tabs" role="tablist">
    <button class="tab active" data-panel="matches">
      Matchs <span class="tab-count" id="count-matches">0</span>
    </button>
    <button class="tab" data-panel="channels">
      Chaînes <span class="tab-count" id="count-channels">0</span>
    </button>
  </div>
  <div class="clock" id="clock">--:--</div>
</nav>

<main>
  <div class="panel active" id="panel-matches">
    <div id="matches-content">
      <div class="loader">Chargement</div>
    </div>
  </div>

  <div class="panel" id="panel-channels">
    <div class="grid channels-grid" id="channels-content">
      <div class="loader">Chargement</div>
    </div>
  </div>
</main>

<footer>
  <div class="foot-nav">
    <a href="/dmca.html">DMCA</a>
    <a href="/mentions.html">Mentions</a>
    <a href="/conditions.html">Conditions</a>
    <a href="/confidentialite.html">Confidentialité</a>
  </div>
  <div class="foot-sources">
    <span>Sources</span>
    <a href="https://www.fctv33.com/" target="_blank" rel="noopener">FCTV33</a>
    <a href="https://cdnlivetv.is/" target="_blank" rel="noopener">CDN Live TV</a>
  </div>
</footer>

<script src="/streams.js"></script>
<script src="/channels.js"></script>
<script>
const FALLBACK = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><rect width='80' height='80' fill='%23141414'/></svg>";

function parisTime(s){
  if(!s) return 0;
  if(!s.includes('Z') && !s.includes('+')) return new Date(s+'+02:00').getTime();
  return new Date(s).getTime();
}

function renderMatches(){
  const cont = document.getElementById('matches-content');
  const countEl = document.getElementById('count-matches');
  const all = (window.TPZ_STREAMS || []).filter(m => m.visible !== false);
  if(countEl) countEl.textContent = all.length;

  if(!all.length){
    cont.innerHTML = '<div class="loader">Aucun match</div>';
    return;
  }

  all.sort((a,b)=>(a.priorite||99)-(b.priorite||99));

  const groups = {};
  all.forEach(m => {
    const s = m.sport || "Autres";
    const c = m.competition || "";
    if(!groups[s]) groups[s] = {};
    if(!groups[s][c]) groups[s][c] = [];
    groups[s][c].push(m);
  });

  let html = '';
  for(const s in groups){
    const sportLabel = s.replace(/^[\p{Emoji}\s]+/u,'') || s;
    const total = Object.values(groups[s]).flat().length;
    html += `<section class="section"><div class="section-head"><h2>${sportLabel}</h2><span class="count">${total}</span></div>`;
    for(const c in groups[s]){
      if(c) html += `<div class="comp-label">${c}</div>`;
      html += '<div class="grid">';
      groups[s][c].forEach(m => {
        let isLive = true, isCountdown = false;
        if(m.forceLive) isLive = true;
        else if(m.heureDebut && parisTime(m.heureDebut) > Date.now()){ isLive = false; isCountdown = true; }

        const status = isLive
          ? `<div class="status live"><span class="status-dot"></span>En direct</div>`
          : `<div class="status waiting">${isCountdown ? 'À venir' : 'Programmé'}</div>`;
        const btn = isLive
          ? `<button class="btn-watch" onclick="openMatch('${m.id}')">Regarder</button>`
          : `<button class="btn-soon" disabled>Bientôt</button>`;

        html += `
          <div class="match" style="${isLive?'':'opacity:.5'}">
            <img class="match-img" src="${m.image||FALLBACK}" alt="" onerror="this.onerror=null;this.src='${FALLBACK}'">
            <div class="match-body">
              ${status}
              <div class="match-name">${m.nom}</div>
              ${btn}
            </div>
          </div>`;
      });
      html += '</div>';
    }
    html += '</section>';
  }
  cont.innerHTML = html;
}

function openMatch(id){ location.href = '/vip/index.html?id=' + encodeURIComponent(id); }

async function renderChannels(){
  const cont = document.getElementById('channels-content');
  const countEl = document.getElementById('count-channels');

  if(!window.TPZ_CHANNELS_LOADED) await loadChannels();
  const chans = window.TPZ_CHANNELS || [];
  if(countEl) countEl.textContent = chans.length;

  if(!chans.length){
    cont.innerHTML = '<div class="loader">Aucune chaîne</div>';
    return;
  }

  cont.innerHTML = chans.map(ch => {
    const online = ch.status === 'online';
    const link = online
      ? `/channel.html?name=${encodeURIComponent(ch.name)}&url=${encodeURIComponent(ch.url)}`
      : '#';
    return `
      <a class="channel ${online?'':'offline'}" href="${link}">
        <img class="channel-logo" src="${ch.image}" alt="" onerror="this.onerror=null;this.src='${FALLBACK}'">
        <div class="channel-info">
          <div class="channel-name">${ch.name}</div>
          <div class="channel-meta">${online?'En direct':'Hors ligne'}</div>
        </div>
      </a>`;
  }).join('');
}

function initTabs(){
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
    });
  });
}

function tick(){
  const el = document.getElementById('clock');
  if(!el) return;
  const d = new Date();
  const f = n => n < 10 ? '0'+n : n;
  el.textContent = `${f(d.getHours())}:${f(d.getMinutes())}`;
}

initTabs();
renderMatches();
renderChannels();
tick();
setInterval(tick, 30000);

document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
