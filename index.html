<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPZ+ - Streaming Sportif</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TPZ+">
    <link rel="manifest" href="site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0a0a0a;
            --bg-alt: #131313;
            --bg-elev: #1a1a1a;
            --border: rgba(255,255,255,0.08);
            --border-strong: rgba(255,255,255,0.18);
            --text: #ffffff;
            --text-dim: #9a9a9a;
            --text-mute: #6b6b6b;
            --red: #dc314e;
            --red-hover: #f46e84;
            --cyan: #67e8f9;
            --green: #22c55e;
            --nav-height: 64px;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex; flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -webkit-user-select: none; user-select: none;
        }

        /* ── NAVBAR ── */
        header {
            padding: 0 24px;
            height: var(--nav-height);
            background: rgba(10,10,10,0.85);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
            gap: 20px;
        }
        .brand {
            display: flex; align-items: center; gap: 6px;
            font-weight: 900;
            font-size: 1.25rem;
            font-style: italic;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text);
            flex-shrink: 0;
        }
        .brand .plus { color: var(--red); }

        .clock {
            display: flex; flex-direction: column;
            align-items: flex-end;
            line-height: 1;
            margin-left: auto;
        }
        .clock .time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text);
        }
        .clock .date {
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-mute);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 4px;
        }

        /* ── MAIN ── */
        .main {
            padding: 32px 24px 60px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        /* ── HERO ── */
        .hero {
            display: flex; flex-wrap: wrap;
            align-items: flex-end; justify-content: space-between;
            gap: 16px;
            margin-bottom: 28px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        .hero-text h1 {
            font-size: 1.9rem;
            font-weight: 800;
            font-style: italic;
            letter-spacing: -1px;
            margin: 0 0 6px 0;
            text-transform: uppercase;
        }
        .hero-text h1 .accent { color: var(--red); }
        .hero-text p {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin: 0;
        }
        .hero-stats {
            display: flex; gap: 24px;
            flex-wrap: wrap;
        }
        .stat {
            display: flex; flex-direction: column;
            gap: 2px;
        }
        .stat .num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1;
        }
        .stat .num.red { color: var(--red); }
        .stat .num.cyan { color: var(--cyan); }
        .stat .lbl {
            font-size: 0.62rem;
            font-weight: 700;
            color: var(--text-mute);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* ── TOOLBAR (filtres + actualiser) ── */
        .toolbar {
            display: flex; flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
        }
        .filters {
            display: flex; flex-wrap: wrap;
            gap: 6px;
            flex: 1;
        }
        .filter-btn {
            background: var(--bg-alt);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 9px 14px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.72rem;
            font-weight: 700;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .filter-btn:hover {
            color: var(--text);
            border-color: var(--border-strong);
        }
        .filter-btn.active {
            background: var(--red);
            border-color: var(--red);
            color: white;
        }

        .btn-refresh {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 9px 14px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.72rem;
            font-weight: 700;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex; align-items: center; gap: 6px;
            flex-shrink: 0;
        }
        .btn-refresh:hover {
            color: var(--text);
            border-color: var(--border-strong);
        }
        .btn-refresh.spinning svg { animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── LOADER ── */
        #no-match {
            text-align: center;
            padding: 100px 20px;
            color: var(--text-dim);
            display: flex; flex-direction: column;
            align-items: center; gap: 16px;
        }
        .loader-ball {
            font-size: 2.5rem;
            animation: bounce 0.6s cubic-bezier(0.5, 0.05, 1, 0.5) infinite alternate;
        }
        @keyframes bounce {
            0% { transform: translateY(0) scaleY(0.9); }
            100% { transform: translateY(-22px) scaleY(1.1); }
        }
        .loader-text {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-mute);
            animation: pulseText 1.5s infinite;
        }
        @keyframes pulseText { 0%,100%{opacity:1} 50%{opacity:.4} }

        /* ── SECTIONS SPORT ── */
        .section { margin-bottom: 8px; }
        .section-head {
            display: flex; align-items: center;
            gap: 10px;
            margin: 40px 0 16px 0;
        }
        .section-head .emoji { font-size: 1.3rem; }
        .section-head h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }
        .section-head .count {
            font-size: 0.62rem;
            font-weight: 700;
            color: var(--red);
            background: rgba(220,49,78,0.1);
            border: 1px solid rgba(220,49,78,0.25);
            padding: 3px 8px;
            border-radius: 4px;
            margin-left: 6px;
            letter-spacing: 1px;
        }
        .section-head::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
            margin-left: 10px;
        }

        .comp-head {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-mute);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 20px 0 12px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .comp-head::before {
            content: "";
            width: 4px; height: 4px;
            background: var(--red);
            border-radius: 50%;
        }

        /* ── GRILLE ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 12px;
        }

        /* ── CARTES ── */
        .card {
            display: flex;
            align-items: stretch;
            background: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            transition: background 0.2s, border-color 0.2s, transform 0.15s;
        }
        .card:hover {
            background: var(--bg-elev);
            border-color: var(--border-strong);
            transform: translateY(-2px);
        }
        .card::before {
            content: "";
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--red);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .card.live::before { opacity: 1; }
        .card.live { box-shadow: inset 4px 0 0 0 rgba(220,49,78,0.15); }

        .card-img {
            width: 100px;
            min-height: 90px;
            object-fit: cover;
            background: #1a1a1a;
            flex-shrink: 0;
            border-right: 1px solid var(--border);
        }
        .card-info {
            flex: 1;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }
        .match-name {
            font-size: 0.92rem;
            font-weight: 700;
            font-style: italic;
            margin: 0 0 10px 0;
            line-height: 1.25;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: -0.3px;
        }

        /* ── BOUTONS ── */
        .btn-regarder {
            background: var(--red);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            font-family: inherit;
            font-weight: 700;
            font-style: italic;
            font-size: 0.78rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
            align-self: flex-start;
        }
        .btn-regarder:hover { background: var(--red-hover); }

        .btn-attente {
            background: #1e1e1e;
            color: var(--text-mute);
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: 4px;
            font-family: inherit;
            font-weight: 700;
            font-style: italic;
            font-size: 0.78rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: not-allowed;
            align-self: flex-start;
        }

        /* ── STATUTS ── */
        .live-dot {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.66rem;
            font-weight: 700;
            color: var(--red);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .live-dot .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--red);
            animation: blink 1.2s infinite;
            box-shadow: 0 0 8px rgba(220,49,78,0.6);
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

        .waiting-dot {
            display: block;
            font-size: 0.66rem;
            font-weight: 700;
            color: var(--text-mute);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        /* ── FOOTER ── */
        footer {
            padding: 20px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: var(--bg);
        }
        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
        }
        .footer-links a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .footer-links a:hover { color: var(--text); }
        footer p {
            margin: 0;
            font-size: 0.72rem;
            color: var(--text-mute);
        }
        footer p .made { color: var(--red); font-weight: 700; font-style: italic; }

        /* ══════════════════════════════════════
           RESPONSIVE MOBILE — soigné
           ══════════════════════════════════════ */
        @media (max-width: 900px) {
            .main { padding: 24px 18px 50px; }
            .hero-text h1 { font-size: 1.6rem; }
        }

        @media (max-width: 700px) {
            :root { --nav-height: 58px; }
            header { padding: 0 14px; gap: 10px; }
            .brand { font-size: 1rem; letter-spacing: -0.3px; }
            .clock .time { font-size: 0.9rem; letter-spacing: 0.5px; }
            .clock .date { font-size: 0.5rem; letter-spacing: 1px; margin-top: 3px; }

            .main { padding: 18px 12px 40px; }

            /* Hero */
            .hero {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
                margin-bottom: 20px;
                padding-bottom: 18px;
            }
            .hero-text h1 { font-size: 1.3rem; letter-spacing: -0.5px; }
            .hero-text p { font-size: 0.75rem; line-height: 1.5; }
            .hero-stats { gap: 20px; }
            .stat .num { font-size: 1.15rem; }
            .stat .lbl { font-size: 0.55rem; letter-spacing: 1.2px; }

            /* Toolbar */
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                margin-bottom: 16px;
            }
            .filters {
                overflow-x: auto;
                flex-wrap: nowrap;
                gap: 6px;
                padding-bottom: 6px;
                margin: 0 -12px;
                padding-left: 12px;
                padding-right: 12px;
                scrollbar-width: none;
                -ms-overflow-style: none;
            }
            .filters::-webkit-scrollbar { display: none; }
            .filter-btn {
                font-size: 0.66rem;
                padding: 8px 12px;
                flex-shrink: 0;
            }
            .btn-refresh {
                width: 100%;
                justify-content: center;
                font-size: 0.68rem;
                padding: 10px;
            }

            /* Titres */
            .section-head { margin: 26px 0 12px 0; gap: 8px; }
            .section-head .emoji { font-size: 1.1rem; }
            .section-head h2 { font-size: 1rem; letter-spacing: -0.3px; }
            .section-head .count { font-size: 0.58rem; padding: 2px 6px; }
            .comp-head { font-size: 0.66rem; margin: 14px 0 10px 0; letter-spacing: 1.2px; }

            /* Grille */
            .grid { grid-template-columns: 1fr; gap: 10px; }

            /* Cartes */
            .card { border-radius: 6px; }
            .card-img { width: 84px; min-height: 80px; }
            .card-info { padding: 12px 14px; }
            .match-name { font-size: 0.86rem; margin-bottom: 9px; line-height: 1.2; }
            .btn-regarder, .btn-attente { padding: 7px 14px; font-size: 0.7rem; }

            .live-dot, .waiting-dot { font-size: 0.6rem; letter-spacing: 0.8px; margin-bottom: 6px; }

            /* Footer */
            footer { padding: 18px 14px; gap: 12px; }
            .footer-links { gap: 12px; }
            .footer-links a { font-size: 0.7rem; }
            footer p { font-size: 0.66rem; text-align: center; }
        }

        @media (max-width: 400px) {
            .brand { font-size: 0.9rem; }
            .clock .time { font-size: 0.8rem; }
            .hero-text h1 { font-size: 1.15rem; }
            .card-img { width: 72px; min-height: 72px; }
            .card-info { padding: 10px 12px; }
            .match-name { font-size: 0.8rem; }
            .btn-regarder, .btn-attente { padding: 6px 12px; font-size: 0.65rem; }
            .filter-btn { font-size: 0.62rem; padding: 7px 10px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand">TPZ<span class="plus">+</span></a>
        <div class="clock">
            <span class="time" id="tpz-clock">--:--:--</span>
            <span class="date" id="tpz-date">—</span>
        </div>
    </header>

    <div class="main" id="streams-container">
        <div class="hero">
            <div class="hero-text">
                <h1>Diffusions <span class="accent">en live</span></h1>
                <p>Tous les matchs disponibles en direct, mis à jour en temps réel.</p>
            </div>
            <div class="hero-stats">
                <div class="stat">
                    <span class="num red" id="stat-live">0</span>
                    <span class="lbl">En direct</span>
                </div>
                <div class="stat">
                    <span class="num cyan" id="stat-total">0</span>
                    <span class="lbl">Programmés</span>
                </div>
            </div>
        </div>

        <div class="toolbar">
            <div class="filters" id="filters"></div>
            <button class="btn-refresh" id="btn-refresh" title="Rafraîchir">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                    <path d="M21 3v5h-5"></path>
                    <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                    <path d="M3 21v-5h5"></path>
                </svg>
                Actualiser
            </button>
        </div>

        <div id="streams-content">
            <div id="no-match">
                <div class="loader-ball">⚽</div>
                <div class="loader-text">Initialisation des flux…</div>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="dmca.html">DMCA</a>
            <a href="mentions.html">Terms of Service</a>
            <a href="mentions.html">Privacy Policy</a>
            <a href="index.html">Accueil</a>
        </div>
        <p>TPZ+ — Made by <span class="made">C3LI4N</span> with Deepseek</p>
    </footer>

    <script src="streams.js"></script>
    <script>
        const FALLBACK_IMG = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iNzUiPjxyZWN0IHdpZHRoPSIxMDAiIGhlaWdodD0iNzUiIGZpbGw9IiMxMzEzMTMiLz48dGV4dCB4PSI1MCIgeT0iNDMiIGZpbGw9IiM2YjZiNmIiIGZvbnQtZmFtaWx5PSJBcmlhbCxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE2IiBmb250LXdlaWdodD0iNzAwIiBmb250LXN0eWxlPSJpdGFsaWMiIHRleHQtYW5jaG9yPSJtaWRkbGUiPlRQWis8L3RleHQ+PC9zdmc+";

        let currentFilter = 'all';

        function getParisTime(dateStr) {
            if (!dateStr) return 0;
            if (!dateStr.includes('Z') && !dateStr.includes('+')) return new Date(dateStr + '+02:00').getTime();
            return new Date(dateStr).getTime();
        }

        function renderFilters(streams) {
            const sports = new Set();
            streams.forEach(m => { if (m.sport) sports.add(m.sport); });
            const filters = document.getElementById('filters');

            let html = `<button class="filter-btn active" data-sport="all">Tous</button>`;
            sports.forEach(s => {
                const emojiMatch = s.match(/^(\p{Emoji_Presentation}|\p{Extended_Pictographic})\s*/u);
                const emoji = emojiMatch ? emojiMatch[1] : '';
                const label = emojiMatch ? s.replace(emojiMatch[0], '') : s;
                html += `<button class="filter-btn" data-sport="${s}">${emoji} ${label}</button>`;
            });
            filters.innerHTML = html;

            filters.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    filters.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.sport;
                    applyFilters();
                });
            });
        }

        function renderStreams() {
            const allStreams = (window.TPZ_STREAMS || []).filter(m => m.visible !== false);
            if (!allStreams.length) {
                document.getElementById('streams-content').innerHTML = '<div id="no-match"><div class="loader-ball">⚽</div><div class="loader-text">Aucun match programmé</div></div>';
                updateStats(0, 0);
                return;
            }
            renderFilters(allStreams);
            applyFilters();
        }

        function applyFilters() {
            const cont = document.getElementById('streams-content');
            const allStreams = (window.TPZ_STREAMS || []).filter(m => m.visible !== false);

            let streams = allStreams;
            if (currentFilter !== 'all') {
                streams = streams.filter(m => m.sport === currentFilter);
            }

            if (!streams.length) {
                cont.innerHTML = '<div id="no-match"><div class="loader-ball">🔍</div><div class="loader-text">Aucun résultat</div></div>';
                updateStats(0, 0);
                return;
            }

            streams.sort((a, b) => (a.priorite || 99) - (b.priorite || 99));

            const groups = {};
            streams.forEach(m => {
                const s = m.sport || "Autres";
                const c = m.competition || "Direct";
                if (!groups[s]) groups[s] = {};
                if (!groups[s][c]) groups[s][c] = [];
                groups[s][c].push(m);
            });

            let html = '';
            let liveCount = 0;
            let totalCount = streams.length;

            for (const s in groups) {
                const emojiMatch = s.match(/^(\p{Emoji_Presentation}|\p{Extended_Pictographic})\s*/u);
                const emoji = emojiMatch ? emojiMatch[1] : '🏆';
                const sportLabel = emojiMatch ? s.replace(emojiMatch[0], '') : s;
                const sportTotal = Object.values(groups[s]).flat().length;

                html += `
                    <div class="section">
                        <div class="section-head">
                            <span class="emoji">${emoji}</span>
                            <h2>${sportLabel}</h2>
                            <span class="count">${sportTotal}</span>
                        </div>`;

                for (const c in groups[s]) {
                    html += `<div class="comp-head">${c}</div><div class="grid">`;

                    groups[s][c].forEach(m => {
                        let statusHtml, buttonHtml;
                        let isLive = true, isCountdown = false;

                        if (m.forceLive) isLive = true;
                        else if (m.heureDebut) {
                            if (getParisTime(m.heureDebut) > Date.now()) { isLive = false; isCountdown = true; }
                        }

                        if (isLive) {
                            liveCount++;
                            statusHtml = `<div class="live-dot"><div class="dot"></div> En Direct</div>`;
                            buttonHtml = `<button onclick="openMatch('${m.id}')" class="btn-regarder">Regarder</button>`;
                        } else {
                            statusHtml = isCountdown
                                ? `<div class="waiting-dot match-timer" data-time="${m.heureDebut}" data-id="${m.id}" data-live="false">⏳ Calcul…</div>`
                                : `<div class="waiting-dot">⏳ Bientôt</div>`;
                            buttonHtml = `<button class="btn-attente" disabled>Bientôt</button>`;
                        }

                        html += `
                        <div class="card ${isLive ? 'live' : ''}" id="card-${m.id}" style="${isLive ? '' : 'opacity: 0.55;'}">
                            <img src="${m.image || FALLBACK_IMG}" class="card-img" onerror="this.onerror=null;this.src='${FALLBACK_IMG}'">
                            <div class="card-info">
                                ${statusHtml}
                                <h3 class="match-name">${m.nom}</h3>
                                ${buttonHtml}
                            </div>
                        </div>`;
                    });
                    html += `</div>`;
                }
                html += `</div>`;
            }

            cont.innerHTML = html;
            updateStats(liveCount, totalCount);
        }

        function updateStats(live, total) {
            document.getElementById('stat-live').textContent = live;
            document.getElementById('stat-total').textContent = total;
        }

        window.openMatch = function(id) {
            window.location.href = 'vip/index.html?id=' + encodeURIComponent(id);
        };

        /* ── Horloge ── */
        (function(){
            const DAYS = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
            const MONTHS = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
            function tick(){
                const timeEl = document.getElementById('tpz-clock');
                const dateEl = document.getElementById('tpz-date');
                if (!timeEl) return;
                const d = new Date();
                const f = n => n < 10 ? '0' + n : n;
                timeEl.textContent = `${f(d.getHours())}:${f(d.getMinutes())}:${f(d.getSeconds())}`;
                dateEl.textContent = `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
            }
            tick();
            setInterval(tick, 1000);
        })();

        /* ── Bouton rafraîchir ── */
        document.getElementById('btn-refresh').addEventListener('click', function() {
            this.classList.add('spinning');
            setTimeout(() => this.classList.remove('spinning'), 600);
            renderStreams();
        });

        /* ── Compte à rebours ── */
        setInterval(() => {
            const now = Date.now();
            document.querySelectorAll('.match-timer').forEach(el => {
                if (el.dataset.live === "true") return;
                const diff = getParisTime(el.dataset.time) - now;
                if (diff > 0) {
                    const t = Math.floor(diff / 1000);
                    const d = Math.floor(t / 86400);
                    const h = Math.floor((t % 86400) / 3600);
                    const m = Math.floor((t % 3600) / 60);
                    const s = t % 60;
                    const f = n => n < 10 ? '0' + n : n;
                    el.innerHTML = `⏳ ${d > 0 ? d + 'J ' : ''}${f(h)}H ${f(m)}M ${f(s)}S`;
                } else {
                    location.reload();
                }
            });
        }, 1000);

        renderStreams();

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
        };
    </script>
</body>
</html>
